name: Build extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix ext-ui

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package zip
        id: package
        run: |
          version=$(node -p "require('./manifest.json').version")
          zip_name="nsfw-safe-history-${version}.zip"
          crx_name="nsfw-safe-history-${version}.crx"
          (cd dist && zip -r "../${zip_name}" .)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "zip=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "crx=${crx_name}" >> "$GITHUB_OUTPUT"

      - name: Pack CRX
        id: crx
        env:
          EXTENSION_PRIVATE_KEY: ${{ secrets.EXTENSION_PRIVATE_KEY }}
        run: |
          version="${{ steps.package.outputs.version }}"
          crx_name="${{ steps.package.outputs.crx }}"
          if [ -z "$EXTENSION_PRIVATE_KEY" ]; then
            echo "EXTENSION_PRIVATE_KEY secret is not set — skipping CRX pack."
            echo "packed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/pack-crx.js --crx "$crx_name"
          test -f "$crx_name"
          echo "packed=true" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: notes
        run: |
          version="${{ steps.package.outputs.version }}"
          crx_packed="${{ steps.crx.outputs.packed }}"
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const crxPacked = process.env.CRX_PACKED === 'true';
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## [${version}]`;
          const start = changelog.indexOf(heading);
          let body = '';
          if (start !== -1) {
            let rest = changelog.slice(start + heading.length);
            rest = rest.replace(/^\s*—\s*[^\n]*\n?/, '');
            const next = rest.search(/\n## \[/);
            body = (next === -1 ? rest : rest.slice(0, next)).trim();
          }
          const install = crxPacked
            ? [
                '### Install',
                '',
                '**Option A — ZIP (Load unpacked)**',
                `1. Download \`nsfw-safe-history-${version}.zip\``,
                '2. Unzip the archive',
                '3. Open `chrome://extensions`, enable **Developer mode**, click **Load unpacked**',
                '4. Select the unzipped folder (contains `manifest.json`)',
                '',
                '**Option B — CRX (Developer mode)**',
                `1. Download \`nsfw-safe-history-${version}.crx\``,
                '2. Open `chrome://extensions`, enable **Developer mode**',
                '3. Drag the `.crx` onto the page (or use *Pack extension* style sideload). Note: Chrome may show `CRX_REQUIRED_PROOF_MISSING` unless Developer mode is on.'
              ]
            : [
                '### Install',
                `1. Download \`nsfw-safe-history-${version}.zip\` below`,
                '2. Unzip the archive',
                '3. Open `chrome://extensions`, enable **Developer mode**, click **Load unpacked**',
                '4. Select the unzipped folder (contains `manifest.json`)'
              ];
          const notes = [
            `## NSFW Safe History v${version}`,
            '',
            'Chrome extension that clears adult sites from history on visit and blurs NSFW media with on-device classification — no image upload.',
            '',
            body || 'See CHANGELOG.md for details.',
            '',
            ...install,
            '',
            '### Links',
            '- [README](https://github.com/artechio/NSFW-Safe-History#readme)',
            '- [Changelog](https://github.com/artechio/NSFW-Safe-History/blob/main/CHANGELOG.md)',
            '- [Signing / CRX](https://github.com/artechio/NSFW-Safe-History/blob/main/docs/SIGNING.md)',
            '- [Report an issue](https://github.com/artechio/NSFW-Safe-History/issues)',
            ''
          ].join('\n');
          fs.writeFileSync('release-notes.md', notes);
          console.log(notes);
          NODE
        env:
          VERSION: ${{ steps.package.outputs.version }}
          CRX_PACKED: ${{ steps.crx.outputs.packed }}

      - uses: actions/upload-artifact@v4
        with:
          name: nsfw-safe-history
          path: |
            nsfw-safe-history-*.zip
            nsfw-safe-history-*.crx
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.package.outputs.version }}"
          zip_name="${{ steps.package.outputs.zip }}"
          crx_name="${{ steps.package.outputs.crx }}"
          tag="v${version}"
          assets=("$zip_name")
          if [ -f "$crx_name" ]; then
            assets+=("$crx_name")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" \
              --title "NSFW Safe History v${version}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$tag" "${assets[@]}" \
              --title "NSFW Safe History v${version}" \
              --notes-file release-notes.md \
              --latest
          fi
