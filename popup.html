<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSFW Safe History</title>
    <link href="assets/popup.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1 class="title">NSFW Safe History</h1>
        <span class="version-badge" id="versionBadge"></span>
    </div>

    <div class="section">
        <div class="toggle-wrapper">
            <span class="toggle-label">فیلتر این سایت</span>
            <label class="toggle">
                <input type="checkbox" id="excludeToggle" class="toggle-checkbox" checked>
            </label>
        </div>
        <p id="excludeToggleLabel" class="toggle-status">پاک‌کردن هیستوری و بلور برای این سایت فعال است</p>
    </div>

    <div class="section">
        <div class="toggle-wrapper">
            <span class="toggle-label">بلور تصاویر NSFW</span>
            <label class="toggle">
                <input type="checkbox" id="blurToggle" class="toggle-checkbox" checked>
            </label>
        </div>
        <p class="toggle-status">فقط تصاویری که مدل روی دستگاه به‌عنوان محتوای بزرگسال تشخیص دهد بلور می‌شوند.</p>
    </div>

    <div class="section" id="clearSection">
        <p class="toggle-label">پاک‌کردن هیستوری منطبق</p>
        <p class="toggle-status">کدام بازه پاک شود؟</p>
        <div class="range-grid" role="group" aria-label="بازه هیستوری">
            <button type="button" class="btn btn-range" data-range="today">امروز</button>
            <button type="button" class="btn btn-range" data-range="week">هفته</button>
            <button type="button" class="btn btn-range" data-range="month">ماه</button>
            <button type="button" class="btn btn-range" data-range="all">کل تاریخچه</button>
        </div>
        <button id="clearHistory" class="btn btn-danger" type="button" disabled>
            <span>پاک‌کردن بازه انتخاب‌شده</span>
        </button>
    </div>

    <button id="openOptions" class="btn btn-link" type="button">تنظیمات پیشرفته</button>
    <script src="popup.js"></script>
</body>
</html>
