<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSFW Safe History</title>
    <link href="assets/popup.css" rel="stylesheet">
</head>

<body class="p-4 bg-gray-900 text-white mx-auto rounded-lg shadow-lg" style="width: 320px; min-height: 400px;">

    <!-- Header -->
    <div class="header">
        <h1 class="title">NSFW Safe History</h1>
        <span class="version-badge">v1.1.0</span>
    </div>

    <!-- Website Filter Section -->
    <div class="section">
        <div class="toggle-wrapper">
            <span class="toggle-label">Website Filter</span>
            <label class="toggle">
                <input type="checkbox" id="excludeToggle" class="toggle-checkbox" checked>
            </label>
        </div>
        <p id="excludeToggleLabel" class="toggle-status">Filter is active for this website</p>
    </div>

    <!-- Default Keywords Toggle -->
    <div class="section">
        <div class="toggle-wrapper">
            <span class="toggle-label">Use Default Keywords</span>
            <label class="toggle">
                <input type="checkbox" id="defaultKeywordsToggle" class="toggle-checkbox" checked>
            </label>
        </div>
    </div>

    <!-- Add Keyword Section -->
    <div class="section">
        <div class="input-group">
            <input type="text" id="keywordInput" class="keyword-input" placeholder="Enter keyword">
            <button id="addKeyword" class="btn btn-primary">Add</button>
        </div>
        
        <div class="keyword-list">
            <ul id="keywordList">
                <!-- Keywords will be added here -->
            </ul>
        </div>
    </div>

    <!-- Clear History Button -->
    <div class="section">
        <button id="clearHistory" class="btn btn-danger">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>Clear NSFW History</span>
        </button>
    </div>

    <!-- Settings Link -->
    <button id="openOptions" class="btn btn-link">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Advanced Settings</span>
    </button>

    <script src="popup.js"></script>
</body>

</html>
