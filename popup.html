<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSFW Safe History</title>
    <link href="assets/popup.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1 class="title">NSFW Safe History</h1>
        <span class="version-badge" id="versionBadge"></span>
    </div>

    <div class="section">
        <div class="toggle-wrapper">
            <span class="toggle-label">Filter this site</span>
            <label class="toggle">
                <input type="checkbox" id="excludeToggle" class="toggle-checkbox" checked>
            </label>
        </div>
        <p id="excludeToggleLabel" class="toggle-status">History cleaning and blur are on for this site</p>
    </div>

    <div class="section">
        <div class="toggle-wrapper">
            <span class="toggle-label">Blur NSFW images</span>
            <label class="toggle">
                <input type="checkbox" id="blurToggle" class="toggle-checkbox" checked>
            </label>
        </div>
        <p class="toggle-status">Only images the on-device model marks as adult are blurred.</p>
    </div>

    <div class="section" id="clearSection">
        <p class="toggle-label">Clear matching history</p>
        <p class="toggle-status">Which period should be cleaned?</p>
        <div class="range-grid" role="group" aria-label="History range">
            <button type="button" class="btn btn-range" data-range="today">Today</button>
            <button type="button" class="btn btn-range" data-range="week">This week</button>
            <button type="button" class="btn btn-range" data-range="month">This month</button>
            <button type="button" class="btn btn-range" data-range="all">All history</button>
        </div>
        <button id="clearHistory" class="btn btn-danger" type="button" disabled>
            <span>Clear selected range</span>
        </button>
    </div>

    <button id="openOptions" class="btn btn-link" type="button">Advanced settings</button>
    <script src="popup.js"></script>
</body>
</html>
