<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NSFW Safe History Settings</title>
    <link href="assets/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>NSFW Safe History</h1>
        <p id="status" class="status hidden" role="status"></p>

        <section class="section">
            <h2>Protection</h2>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="enabled">
                <label for="enabled">Enable protection</label>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="autoDeleteHistory">
                <label for="autoDeleteHistory">Delete matching history as soon as a page is visited</label>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="blurEnabled">
                <label for="blurEnabled">Blur images the on-device model marks as adult</label>
            </div>
            <label for="blurIntensity">Blur strength (px)</label>
            <input type="number" id="blurIntensity" min="5" max="40" step="1">
            <label for="nsfwThreshold">Detection threshold (0.50–0.95)</label>
            <input type="number" id="nsfwThreshold" min="0.5" max="0.95" step="0.05">
        </section>

        <section class="section">
            <h2>Custom domains</h2>
            <p>One domain per line. Visits to these domains are removed from history.</p>
            <textarea id="customDomains" spellcheck="false"></textarea>
        </section>

        <section class="section">
            <h2>Excluded sites</h2>
            <p>One hostname per line. These sites are left unchanged.</p>
            <textarea id="excludedSites" spellcheck="false"></textarea>
        </section>

        <section class="section">
            <h2>Domain list</h2>
            <p id="blocklistMeta">The built-in adult-domain list updates weekly.</p>
            <button id="updateBlocklist" class="btn-secondary" type="button">Update domain list now</button>
        </section>

        <div class="actions flex space-x-2">
            <button id="save" class="btn-primary" type="button">Save settings</button>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
