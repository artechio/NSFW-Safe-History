<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NSFW Safe History Settings</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
</head>
<body>
    <div class="options-container">
        <div class="option-card">
            <div class="option-header">
                <h3>Image Privacy Settings</h3>
            </div>
            <div class="option-row">
                <label class="switch-container">
                    <input type="checkbox" id="enableImageBlur">
                    <span class="slider"></span>
                    <span class="option-label">Enable Image Blurring</span>
                </label>
                <p class="option-description">Blur sensitive images until clicked to reveal</p>
            </div>
            <div class="sub-options" id="blurOptions">
                <div class="option-row">
                    <label class="select-container">
                        Blur Intensity
                        <select id="blurAmount" class="modern-select">
                            <option value="5">Light</option>
                            <option value="10">Medium</option>
                            <option value="15">Strong</option>
                        </select>
                    </label>
                </div>
                <div class="option-row">
                    <label class="switch-container">
                        <input type="checkbox" id="blurOnlyNSFW">
                        <span class="slider"></span>
                        <span class="option-label">Only blur detected NSFW images</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
